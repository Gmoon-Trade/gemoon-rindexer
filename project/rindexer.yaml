    tables:
      # Одна строка на пул: текущая цена после последнего свопа.
      # price хранится как целое с 18 знаками после запятой (1 актив = price / 1e18 USDG).
      # Формула зависит от того, каким по счёту токеном актив стоит в пуле и сколько у него
      # знаков после запятой, поэтому операций три. Условия взаимоисключающие, так что на
      # одно событие срабатывает ровно одна. sqrtPriceX96 < 2^96 значит, что актив
      # (18 знаков) стоит token0 против USDG (6 знаков); исключение одно — cbBTC (8 знаков).
      - name: prices
        timestamp: true
        columns:
          - name: pool
            type: address
          - name: asset
            type: address
          - name: price
            type: uint256
          - name: sqrt_price_x96
            type: uint256
          - name: swap_count
            type: uint64
            default: "0"
        events:
          - event: Swap
            operations:
              # актив = token0 (18 знаков): price = sqrtP² / 2^192 * 10^(18-6) * 1e18
              - type: upsert
                where:
                  pool: $rindexer_contract_address
                if: "$rindexer_contract_address != 0x9664D869540E9D0a76f12C6623946C6D5d201e09 && $sqrtPriceX96 < 79228162514264337593543950336"
                set:
                  - column: asset
                    action: set
                    value: $call_static($rindexer_contract_address, "token0()")
                  - column: price
                    action: set
                    value: ($sqrtPriceX96 * $sqrtPriceX96 / 2 ^ 96) * 10 ^ 30 / 2 ^ 96
                  - column: sqrt_price_x96
                    action: set
                    value: $sqrtPriceX96
                  - column: swap_count
                    action: increment
              # актив = token1 (18 знаков): price = 2^192 / sqrtP² * 10^(18-6) * 1e18
              - type: upsert
                where:
                  pool: $rindexer_contract_address
                if: "$rindexer_contract_address != 0x9664D869540E9D0a76f12C6623946C6D5d201e09 && $sqrtPriceX96 >= 79228162514264337593543950336"
                set:
                  - column: asset
                    action: set
                    value: $call_static($rindexer_contract_address, "token1()")
                  - column: price
                    action: set
                    value: (2 ^ 96 * 10 ^ 30 / $sqrtPriceX96) * 2 ^ 96 / $sqrtPriceX96
                  - column: sqrt_price_x96
                    action: set
                    value: $sqrtPriceX96
                  - column: swap_count
                    action: increment
              # cbBTC = token1 (8 знаков): price = 2^192 / sqrtP² * 10^(8-6) * 1e18
              - type: upsert
                where:
                  pool: $rindexer_contract_address
                if: "$rindexer_contract_address == 0x9664D869540E9D0a76f12C6623946C6D5d201e09"
                set:
                  - column: asset
                    action: set
                    value: $call_static($rindexer_contract_address, "token1()")
                  - column: price
                    action: set
                    value: (2 ^ 96 * 10 ^ 20 / $sqrtPriceX96) * 2 ^ 96 / $sqrtPriceX96
                  - column: sqrt_price_x96
                    action: set
                    value: $sqrtPriceX96
                  - column: swap_count
                    action: increment
      # Часовые свечи: одна строка на (пул, час). hour = unix_time / 3600.
      # По ним SQL-функции находят цену 24ч / 7д / 30д назад.
      - name: prices_hourly
        columns:
          - name: pool
            type: address
          - name: hour
            type: uint64
          - name: close
            type: uint256
          - name: high
            type: uint256
          - name: low
            type: uint256
        events:
          - event: Swap
            operations:
              # актив = token0 (18 знаков)
              - type: upsert
                where:
                  pool: $rindexer_contract_address
                  hour: $rindexer_block_timestamp / 3600
                if: "$rindexer_contract_address != 0x9664D869540E9D0a76f12C6623946C6D5d201e09 && $sqrtPriceX96 < 79228162514264337593543950336"
                set:
                  - column: close
                    action: set
                    value: ($sqrtPriceX96 * $sqrtPriceX96 / 2 ^ 96) * 10 ^ 30 / 2 ^ 96
                  - column: high
                    action: max
                    value: ($sqrtPriceX96 * $sqrtPriceX96 / 2 ^ 96) * 10 ^ 30 / 2 ^ 96
                  - column: low
                    action: min
                    value: ($sqrtPriceX96 * $sqrtPriceX96 / 2 ^ 96) * 10 ^ 30 / 2 ^ 96
              # актив = token1 (18 знаков)
              - type: upsert
                where:
                  pool: $rindexer_contract_address
                  hour: $rindexer_block_timestamp / 3600
                if: "$rindexer_contract_address != 0x9664D869540E9D0a76f12C6623946C6D5d201e09 && $sqrtPriceX96 >= 79228162514264337593543950336"
                set:
                  - column: close
                    action: set
                    value: (2 ^ 96 * 10 ^ 30 / $sqrtPriceX96) * 2 ^ 96 / $sqrtPriceX96
                  - column: high
                    action: max
                    value: (2 ^ 96 * 10 ^ 30 / $sqrtPriceX96) * 2 ^ 96 / $sqrtPriceX96
                  - column: low
                    action: min
                    value: (2 ^ 96 * 10 ^ 30 / $sqrtPriceX96) * 2 ^ 96 / $sqrtPriceX96
              # cbBTC = token1 (8 знаков)
              - type: upsert
                where:
                  pool: $rindexer_contract_address
                  hour: $rindexer_block_timestamp / 3600
                if: "$rindexer_contract_address == 0x9664D869540E9D0a76f12C6623946C6D5d201e09"
                set:
                  - column: close
                    action: set
                    value: (2 ^ 96 * 10 ^ 20 / $sqrtPriceX96) * 2 ^ 96 / $sqrtPriceX96
                  - column: high
                    action: max
                    value: (2 ^ 96 * 10 ^ 20 / $sqrtPriceX96) * 2 ^ 96 / $sqrtPriceX96
                  - column: low
                    action: min
                    value: (2 ^ 96 * 10 ^ 20 / $sqrtPriceX96) * 2 ^ 96 / $sqrtPriceX96
